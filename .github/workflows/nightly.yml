name: Nightly

# One always-current build of main, published as a pre-release under a fixed
# "nightly" tag: the download links need no GitHub account, they do not expire
# the way workflow artifacts do, and a pre-release never takes the "Latest"
# badge away from a real release.
#
# Runs every night and stops right away when there are no new commits - the
# nightly tag sits on the commit the current build was made from.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if there are no new commits'
        type: boolean
        default: false

concurrency:
  group: nightly

permissions:
  contents: read

jobs:
  check:
    name: check for new commits
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.ask.outputs.build }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || echo none)
          echo "last nightly: $built"
          echo "main:         $GITHUB_SHA"
          if [ "${{ inputs.force }}" = "true" ] || [ "$built" != "$GITHUB_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits since the last nightly build." >> "$GITHUB_STEP_SUMMARY"
          fi

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/linux.yml

  macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/macos.yml

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/windows.yml

  # all three or none: a dev build missing a platform looks like the platform
  # was dropped rather than broken
  publish:
    name: publish
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # skip-decompress: every artifact here was uploaded with archive: false,
      # so what is stored is the finished file - unpacking it would give the
      # contents of a zip that is itself the thing being released
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Publish the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          # nothing is checked out here, and gh reads the repository off a git
          # remote unless it is told which one
          GH_REPO: ${{ github.repository }}
        run: |
          # Bridge for builds made before the Windows files were renamed (2026-11):
          # their update check looks for exactly its old name. win-x64-qt6 is the
          # new win-x64 (Qt 6), win-x86 the new win-x86-legacy. Drop once 2026.9
          # has been out a month. The old win-x64 (Qt 5) takes the new win-x64 as
          # it is - Qt 6, which is right on Windows 10 and 11
          for f in dist/*-win-x64.zip; do cp "$f" "${f%-win-x64.zip}-win-x64-qt6.zip"; done
          for f in dist/*-win-x86-legacy.zip; do cp "$f" "${f%-win-x86-legacy.zip}-win-x86.zip"; done
          ls -lh dist
          # deleted and recreated rather than edited: the tag has to move to the
          # commit that was just built. It stays "nightly" whatever the release
          # is called: every build with the update check asks for it by that name
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "Automated build from the latest commit on \`main\` (${GITHUB_SHA:0:7}, $(date -u +%Y-%m-%d)). May be unstable - see Releases for the latest stable version. Windows: \`win-x64\` for Windows 10 and 11, \`win-x64-legacy\` (64-bit) or \`win-x86-legacy\` (32-bit) for Windows 7 and 8.1; \`win-x64-qt6\` and \`win-x86\` are copies under the old names, so that older builds can update themselves."
